{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login | Shyam Events & Decorates</title>
    <style>
        :root {
            --bg-base: #faf6f0;
            --card-bg: #ffffff;
            --accent-terracotta: #c85a32;
            --accent-gold: #c28835;
            --text-dark: #2b2118;
            --text-muted: #7d6e63;
            --border-soft: #eddcd2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border-soft);
            box-shadow: 0 4px 15px rgba(43, 33, 24, 0.05);
        }

        .brand-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-terracotta);
            text-align: center;
            margin-bottom: 4px;
        }

        .brand-sub {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text-dark);
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-soft);
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            background: #faf6f0;
            color: var(--text-dark);
        }

        .form-control:focus {
            border-color: var(--accent-terracotta);
            background: #fff;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--accent-terracotta);
            color: #fff;
            padding: 11px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 3px 10px rgba(200, 90, 50, 0.2);
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 0.85rem;
            color: var(--accent-gold);
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .messages {
            margin-bottom: 15px;
            padding: 8px;
            background: #d4edda;
            color: #155724;
            border-radius: 5px;
            font-size: 0.82rem;
            text-align: center;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <div class="brand-title">Shyam Events</div>
            <div class="brand-sub">User Profile & Login</div>

            {% if messages %}
                {% for message in messages %}
                    <div class="messages">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" class="form-control" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" name="phone" class="form-control" placeholder="Enter your mobile number" required>
                </div>

                <div class="form-group">
                    <label>Address</label>
                    <textarea name="address" class="form-control" rows="2" placeholder="Enter your address" required></textarea>
                </div>

                <button type="submit" class="btn-submit">Save & Continue</button>
            </form>

            <a href="{% url 'home' %}" class="back-link">&larr; Back to Home</a>
        </div>
    </div>

</body>
</html>
